name: Atlas checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'ArmenionCH2/pokeemerald-expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev libmgba-dev python3
      - name: Workspace provenance
        run: python3 dev_scripts/atlas.py verify
      - name: Atlas host contracts
        run: python3 dev_scripts/test_atlas.py
      - name: Emerald ROM
        run: make -j2
      - name: Native Atlas smoke test
        run: python3 dev_scripts/test_atlas_emulator.py
